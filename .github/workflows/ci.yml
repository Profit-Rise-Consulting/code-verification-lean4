name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate document spine
        run: scripts/check-docs
      - name: Catalogue is current
        run: |
          scripts/build-catalogue
          git diff --exit-code -- research/references/README.md
      - name: Validate research corpus and handoff
        run: scripts/check-research
