name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Narrow further per job if a job needs less.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # SCAFFOLD: replace every action ref with a full-length commit SHA before enabling this
      # workflow. A tag can be moved; a SHA cannot. Keep the version as a trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: npm install --frozen-lockfile
      - name: Lint
        run: npm lint
      - name: Typecheck
        run: npm exec tsc --noEmit
      - name: Verify generated binding types are current
        run: npm exec wrangler types --check
      - name: Test with coverage
        run: npm test -- --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
